[pytest]
testpaths = tests
pythonpath = .
asyncio_mode = auto
addopts = -q
# Дольше всех живут subprocess-сценарии бота (у них свой лимит 120 с),
# всё остальное укладывается в секунды. 180 — не «сколько можно тесту»,
# а «когда это точно зависание»: сработавший стоп-кран валит прогон со
# стеками всех потоков вместо получаса тишины в CI
timeout = 180
timeout_method = thread
filterwarnings =
    ignore::DeprecationWarning:pydantic.*
