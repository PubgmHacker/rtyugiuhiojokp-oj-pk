name: CI

on:
  push:
    # session/** — рабочие ветки: код туда уходит прямыми пушами, без PR,
    # и без этого триггера все гейты ниже жили только на машине разработчика
    branches: [main, modern-2026, "session/**"]
  pull_request:

# Новый пуш в ту же ветку отменяет предыдущий прогон
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API
    runs-on: ubuntu-latest
    # 12 минут хватало, пока сотня бот-тестов скипалась без venv; с настоящим
    # прогоном (~1000 тестов + subprocess-скрипты в bot/.venv) job сняло
    # ровно на лимите — GitHub помечает такой job как cancelled, не failed
    timeout-minutes: 30
    defaults:
      run:
        working-directory: api
    # Первый живой прогон показал: без Redis e2e-тесты падают — путь
    # «свайп → мэтч» публикует событие в pub/sub по-настоящему, локально
    # это маскировал docker compose. Порт хоста 6380 — как в dev-compose,
    # на него смотрит дефолт REDIS_URL. Postgres не поднимаем: живые базы
    # тестов — SQLite во временном файле, в Postgres никто не ходит.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            api/requirements.txt
            bot/requirements.txt

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Тесты API проверяют и логику бота (платежи, разбан, фич-гейты),
      # выполняя её интерпретатором из bot/.venv. Без venv они молча
      # скипаются — и первый прогон показал цену: ~сотня тестов, среди них
      # приёмка правок аудита, в CI не выполнялась вовсе.
      - name: Окружение бота — для тестов его логики
        working-directory: bot
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt

      - name: Проверка синтаксиса
        run: python -m compileall -q .

      - name: Тесты
        env:
          DEBUG: "true"
          JWT_SECRET: ci_secret_not_for_production
        run: python -m pytest

  bot:
    name: Бот
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: bot
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: bot/requirements.txt

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Проверка синтаксиса
        run: python -m compileall -q .

      - name: Импорт модулей
        # Ловит битые ссылки на состояния FSM и отсутствующие импорты —
        # такая ошибка уже приводила к тому, что бот не стартовал вовсе
        run: python -c "import bot; import handlers.registration, handlers.dating, handlers.matches, handlers.account"

  lint:
    name: Ruff
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      # Гейт настоящий: раньше стоял continue-on-error и job был зелёный
      # всегда, то есть находки никто не видел. Набор правил узкий и по делу
      # (см. ruff.toml) — только то, что ломает продукт, иначе шум приучает
      # игнорировать красный цвет в CI.
      - name: Проверка стиля
        run: ruff check api bot

  web:
    name: Фронтенд
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Установка зависимостей
        run: npm ci

      - name: Проверка типов
        run: npx tsc -b --force

      # Тесты веба ловят гонки в эффектах (устаревший ответ затирает свежий,
      # незакрытый микрофон). Без этого шага они лежали бы в репозитории
      # мёртвым грузом: tsc и сборка такие регрессии не видят.
      - name: Тесты
        run: npx vitest run

      # Здесь полный чекаут, и это делает шаг «Сборка» слепым к главной поломке
      # публикации: образ веба собирается из контекста `web/` (Railway Root
      # Directory: web, web/Dockerfile: COPY . .), где `../../landing` не
      # существует. Символическая ссылка оттуда висит в воздухе, `vite build`
      # копирует publicDir через statSync без защиты и падает целиком — а по
      # этим адресам бот отправляет человека читать политику и оферту.
      - name: Юридические страницы — файлы, а не ссылки наружу
        run: npm run check:landing

      - name: Сборка
        run: npx vite build

  landing:
    name: Лендинг
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Проверка разметки и ссылок
        run: |
          cd landing
          python3 - <<'PY'
          from html.parser import HTMLParser
          import glob, re, sys

          VOID = {"area","base","br","col","embed","hr","img","input",
                  "link","meta","source","track","wbr"}
          SVG = {"path","circle","rect","svg","g","defs","stop",
                 "linearGradient","ellipse","line","polygon","polyline","use"}

          class V(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.stack, self.err, self.insvg = [], [], 0
              def handle_starttag(self, t, a):
                  if t == "svg":
                      self.insvg += 1; return
                  if self.insvg or t in VOID or t in SVG:
                      return
                  self.stack.append((t, self.getpos()))
              def handle_endtag(self, t):
                  if t == "svg":
                      self.insvg = max(0, self.insvg - 1); return
                  if self.insvg or t in VOID or t in SVG:
                      return
                  if not self.stack:
                      self.err.append(f"лишний </{t}> {self.getpos()}"); return
                  top, pos = self.stack.pop()
                  if top != t:
                      self.err.append(f"</{t}>{self.getpos()} закрывает <{top}>{pos}")

          files = set(glob.glob("*.*"))
          failed = False

          for f in sorted(glob.glob("*.html")):
              src = open(f, encoding="utf-8").read()
              p = V(); p.feed(src)
              if p.err or p.stack:
                  failed = True
                  print(f"{f}: разметка — {p.err[:3]} незакрытые={[t for t,_ in p.stack][:3]}")

              for m in re.finditer(r'(?:href|src)="([^"]+)"', src):
                  u = m.group(1)
                  if u.startswith(("http", "mailto:", "#", "data:")):
                      continue
                  target = u.split("#")[0].split("?")[0].lstrip("/")
                  if target and target not in files:
                      failed = True
                      print(f"{f}: битая ссылка -> {u}")

          if failed:
              sys.exit(1)
          print("Лендинг: разметка валидна, битых ссылок нет")
          PY

  docker:
    name: Docker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Проверка docker-compose
        # Сервисы api и bot объявляют env_file: .env, которого в чекауте нет
        # (он в .gitignore) — без него config падает на первом же шаге. Кладём
        # пример, как велит шапка самого docker-compose.yml перед запуском.
        run: cp .env.example .env && docker compose config -q

      - name: Сборка образа API
        uses: docker/build-push-action@v6
        with:
          context: ./api
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Сборка образа бота
        uses: docker/build-push-action@v6
        with:
          context: ./bot
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
