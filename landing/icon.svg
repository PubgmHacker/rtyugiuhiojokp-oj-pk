  </defs>
  <rect width="180" height="180" rx="40" fill="#0a0b0f"/>
  <g transform="translate(90,90) scale(1.55) translate(-50,-50)">
    <path d="M50 8C53 34 66 47 92 50C66 53 53 66 50 92C47 66 34 53 8 50C34 47 47 34 50 8Z" fill="url(#spark)"/>
    <path d="M50 36C50 36 39.5 47 39.5 55.5C39.5 61.8 44.2 66.5 50 66.5C55.8 66.5 60.5 61.8 60.5 55.5C60.5 47 50 36 50 36Z" fill="#fafbfc"/>
