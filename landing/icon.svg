<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180" role="img" aria-label="Souldawn">
  <!-- Знак: одна искра мэтча + капля (soul). Геометрия из tools/brandmark.py.
       Не венн и не два шара — вложенность одной детали в одну форму. -->
  <defs>
