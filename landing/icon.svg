<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180" role="img" aria-label="Souldawn">
  <!-- Знак марки «две ауры»: геометрия из tools/brandmark.py
       (R = 0.25 стороны, смещение центров 0.4403R / 0.2859R) -->
  <defs>
    <clipPath id="lens"><circle cx="70.2" cy="102.9" r="45"/></clipPath>
  </defs>
  <rect width="180" height="180" rx="40" fill="#0a0b0f"/>
  <circle cx="70.2" cy="102.9" r="45" fill="#ff2d6f"/>
  <circle cx="109.8" cy="77.1" r="45" fill="#8b5cf6"/>
  <circle cx="109.8" cy="77.1" r="45" fill="#fafbfc" clip-path="url(#lens)"/>
</svg>
