  <g transform="translate(210,235) scale(1.85) translate(-50,-50)">
    <path fill-rule="evenodd" d="M 50.000,81.494 C 35.850,72.061 31.470,57.236 36.523,43.760 C 40.566,33.652 46.631,24.893 52.021,19.165 C 54.043,27.588 55.391,35.000 56.738,40.391 C 60.107,32.642 64.150,24.219 68.530,21.523 C 69.541,30.957 67.520,41.738 66.172,50.498 C 68.530,60.605 64.150,70.713 57.412,78.125 C 53.369,82.168 51.348,82.842 50.000,81.494 Z M 50.391,66.523 C 44.320,62.477 42.441,56.117 44.609,50.336 C 46.344,46.000 48.945,42.242 51.258,39.785 C 52.000,42.200 52.600,44.200 53.350,45.500 C 54.200,44.200 55.800,42.200 58.340,40.797 C 58.773,44.844 57.906,49.469 57.328,53.227 C 58.340,57.563 56.461,61.898 53.570,65.078 C 51.836,66.812 50.969,67.102 50.391,66.523 Z" fill="url(#ogDawn)"/>
  </g>

  <text x="120" y="430" font-family="Arial, Helvetica, sans-serif" font-size="84" font-weight="800" letter-spacing="-2" fill="#fafbfc">souldawn</text>
  <text x="122" y="484" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="400" fill="#c8cdd4">Люди интереснее, чем их фото</text>
  <text x="122" y="526" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#9ba1ab">Знакомства по интересам · Telegram и iPhone</text>
</svg>
