# Настройки Ruff.
#
# Линтер в CI стоял с `continue-on-error: true`, то есть job всегда был зелёный
# и находки никто не видел. Просто снять флаг нельзя: без настроек ruff даёт 697
# замечаний, из которых почти все — вкусовые или прямо противоречат тому, как
# работают наши библиотеки. Такой «гейт» сломал бы каждый PR и его бы отключили
# обратно.
#
# Поэтому гейт узкий и по делу: включены правила, которые ловят НАСТОЯЩИЕ
# ошибки — необъявленные имена, повторные определения, неиспользуемые импорты и
# переменные. Стиль и модернизацию синтаксиса не проверяем: они не ломают
# продукт, а шум в CI приучает игнорировать красный цвет.

line-length = 100
target-version = "py312"

[lint]
select = [
    "F821",  # обращение к необъявленному имени — падает в рантайме
    "F811",  # повторное определение: второе молча затирает первое
    "F401",  # неиспользуемый импорт
    "F841",  # присвоили и не использовали — обычно забытая правка
    "F632",  # `is` вместо `==` на литералах
    "F502",  # ошибки в форматировании строк
    "E9",    # синтаксис и отступы, ломающие разбор
]

# `== True` в фильтрах SQLAlchemy обязателен: `Match.is_active` без сравнения
# даёт объект колонки, а не условие. Поэтому E712 не включаем вовсе.

[lint.per-file-ignores]
# В тестах и миграциях импорт «на всякий случай» и неиспользуемые заготовки —
# нормальная практика, ошибкой это не является.
"api/tests/*" = ["F401", "F841"]
"api/migrations/*" = ["F401"]
