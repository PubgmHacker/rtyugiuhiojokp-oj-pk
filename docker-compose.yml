# SIMP DATING — локальная разработка
# Запуск: docker compose up -d
# Перед запуском: cp .env.example .env


services:

  # ── PostgreSQL ───────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       simp_dating
      POSTGRES_USER:     simp
      POSTGRES_PASSWORD: simp_dating_dev
    ports:
      - "5433:5432"
    volumes:
      - dating_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U simp"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Redis ────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - dating_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── FastAPI Backend ──────────────────────────────────────────
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://simp:simp_dating_dev@postgres:5432/simp_dating
      REDIS_URL: redis://redis:6379/0
      API_HOST: 0.0.0.0
      API_PORT: 8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./api:/app
      - /app/__pycache__

  # ── Telegram Bot ─────────────────────────────────────────────
  bot:
    build:
      context: ./bot
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://simp:simp_dating_dev@postgres:5432/simp_dating
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
    volumes:
      - ./bot:/app
      - /app/__pycache__

  # ── React Frontend (Vite dev server) ─────────────────────────
  # Dockerfile в web/ — production-сборка (serve dist на :3000, для Railway).
  # Для локальной разработки поднимаем vite dev server напрямую.
  web:
    image: node:20-alpine
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
      VITE_BOT_USERNAME: simp_dating_bot
    depends_on:
      api:
        condition: service_started
    volumes:
      - ./web:/app
      - dating_web_node_modules:/app/node_modules

volumes:
  dating_postgres_data:
  dating_redis_data:
  dating_web_node_modules:
