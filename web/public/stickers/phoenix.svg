<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120"
     width="120" height="120" role="img" aria-label="Феникс">
  <title>Феникс</title>
  <defs>
    <radialGradient id="ф" cx="35%" cy="28%" r="82%">
      <stop offset="0%" stop-color="#e8a13a"/>
      <stop offset="100%" stop-color="#d1622a"/>
    </radialGradient>
  </defs>
  <circle cx="60" cy="60" r="58" fill="url(#ф)"/>
