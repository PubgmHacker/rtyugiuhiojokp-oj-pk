<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120"
     width="120" height="120" role="img" aria-label="Перо">
  <title>Перо</title>
  <defs>
    <radialGradient id="ф" cx="34%" cy="26%" r="86%">
      <stop offset="0%" stop-color="#3a83a6"/>
      <stop offset="52%" stop-color="#2a6480"/>
      <stop offset="100%" stop-color="#17384b"/>
    </radialGradient>
    <!-- Тень под мотивом: плоская фигура на плоском фоне не отделяется от
         подложки, и весь набор выглядит наклейками из одного слоя -->
    <filter id="т" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2"
                    flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>
  <circle cx="60" cy="60" r="58" fill="url(#ф)"/>
  <g filter="url(#т)">
    <path d="M86 24c10 24 0 50-22 62l-8-8 22-24-26 18-6-6 24-26-22 14
                 c4-18 20-30 38-30z" fill="#fff8e7"/>
        <path d="M84 26L38 96" stroke="#fff8e7" stroke-width="5"
              stroke-linecap="round"/>
  </g>
  <!-- Верхний блик: свет падает сверху-слева -->
  <ellipse cx="41" cy="28" rx="27" ry="15" fill="#ffffff" opacity=".16"/>
  <!-- Контровой свет снизу: без него низ шара «проваливается» и подложка
       снова читается матовой пуговицей -->
  <path d="M14 78a58 58 0 0092 0" fill="none" stroke="#ffffff"
        stroke-opacity=".09" stroke-width="7" stroke-linecap="round"/>
  <circle cx="60" cy="60" r="58" fill="none" stroke="#ffffff"
          stroke-opacity=".20" stroke-width="2"/>
</svg>
