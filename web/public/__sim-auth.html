<!doctype html>
<meta charset="utf-8" />
<title>sim auth</title>
<!--
  ВРЕМЕННАЯ фикстура для прогона в симуляторе: повторяет то же, что делает
  кнопка «Продолжить как гость» (POST /auth/dev + запись в localStorage), и
  уводит на нужный маршрут. Нужна потому, что синтетические тапы в симуляторе
  недоступны, а SPA-маршруты открываются по URL. Удаляется после прогона.
-->
<body style="background:#0a0b0f;color:#fafbfc;font:15px -apple-system">
  <p id="s">Вход…</p>
  <script>
    (async () => {
      const из = new URLSearchParams(location.search);
      const куда = из.get("to") || "/";
      try {
        // Логинимся только если токена ещё нет: /auth/dev под лимитом частоты
        // запросов, а на каждый кадр приходился свой вход — на десятом
        // прогоне ручка честно ответила «слишком много запросов».
        if (!localStorage.getItem("sd_token")) {
          const r = await fetch("http://localhost:8001/api/auth/dev", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ device_id: "sim-verify-01", name: "Джакс" }),
          });
          const d = await r.json();
          if (!d.token) throw new Error("нет токена: " + JSON.stringify(d).slice(0, 200));
          localStorage.setItem("sd_token", d.token);
          localStorage.setItem("sd_user", JSON.stringify(d.user));
          localStorage.setItem("sd_device_id", "sim-verify-01");
        }
        // Без &y= уходим на маршрут как раньше. С &y= показываем приложение
        // в iframe того же origin и прокручиваем его: simctl прокрутку не
        // умеет, а часть проверяемого (DecorPicker на /cases) ниже сгиба.
        const y = Number(из.get("y") || 0);
        const цель = из.get("click") || "";
        if (!y && !цель) return location.replace(куда);
        document.body.style.margin = "0";
        document.getElementById("s").remove();
        const рамка = document.createElement("iframe");
        рамка.src = куда;
        рамка.style.cssText = "border:0;width:100vw;height:100vh;display:block";
        рамка.onload = () => {
          const прокрутить = () => {
            const w = рамка.contentWindow;
            w.scrollTo(0, y);
            // Приложение часто скроллит не окно, а внутренний контейнер:
            // прокручиваем и его, иначе кадр остаётся на первом экране.
            for (const el of w.document.querySelectorAll("*")) {
              if (el.scrollHeight > el.clientHeight + 40) el.scrollTop = y;
            }
          };
          прокрутить();
          setTimeout(прокрутить, 1200);
          // Тап синтетический: simctl их не умеет, но iframe того же origin
          // позволяет позвать .click() прямо на нужной кнопке — так
          // открываются шторки (тема чата, задачи, оформление).
          if (цель) {
            setTimeout(() => {
              const w = рамка.contentWindow;
              const узлы = w.document.querySelectorAll('button,[role="button"],a');
              const найден = [...узлы].find(
                (el) =>
                  (el.getAttribute("aria-label") || "") === цель ||
                  el.textContent.trim().includes(цель),
              );
              if (найден) return найден.click();
              document.body.insertAdjacentHTML(
                "afterbegin",
                '<p style="position:fixed;z-index:9;top:44px;left:8px;color:#ff5a5a;' +
                  'font:12px -apple-system">НЕ НАЙДЕНО: ' +
                  цель +
                  " (кнопок: " +
                  узлы.length +
                  ")</p>",
              );
            }, 2200);
          }
          setTimeout(прокрутить, 2500);
        };
        document.body.appendChild(рамка);
      } catch (e) {
        document.getElementById("s").textContent = "ОШИБКА: " + e.message;
      }
    })();
  </script>
</body>
